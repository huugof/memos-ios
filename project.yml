name: MemosIOS
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: 26.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.hugo.MemoChat
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_CFBundleDisplayName: MemoChat
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
targets:
  MemoChat:
    type: application
    platform: iOS
    sources:
      - path: MemoChat
      - path: MemosIOS/Models
      - path: MemosIOS/Services
      - path: MemosIOS/Storage
      - path: MemosIOS/Views/Components
        includes:
          - NoteListEditing.swift
      - path: MemosIOS/Views
        includes:
          - SettingsView.swift
    settings:
      base:
        PRODUCT_NAME: MemoChat
        PRODUCT_BUNDLE_IDENTIFIER: com.hugo.MemoChat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: '"MemoChat/Resources"'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: MemoChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: MemoChat uses the microphone for voice transcription.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: MemoChat uses speech recognition to transcribe your voice notes.

  MemosIOSTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: MemoChat
    sources:
      - path: MemosIOSTests
    dependencies:
      - target: MemoChat
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MemoChat.app/MemoChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MemoChat:
    build:
      targets:
        MemoChat: all
        MemosIOSTests: [test]
    test:
      config: Debug
      targets:
        - MemosIOSTests
    run:
      config: Debug
    archive:
      config: Release
